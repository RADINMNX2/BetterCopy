<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetterCopy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window-container" data-tauri-drag-region>
    <!-- Content Area -->
    <main class="window-content" data-tauri-drag-region>
      <!-- Overall Progress Dashboard -->
      <div class="dashboard" data-tauri-drag-region>
        <div class="stats-grid" data-tauri-drag-region>
          <div class="stat-card">
            <span class="label">Speed</span>
            <span class="value" id="stat-speed">0.0 MB/s</span>
          </div>
          <div class="stat-card">
            <span class="label">Remaining</span>
            <span class="value" id="stat-eta">Calculating...</span>
          </div>
          <div class="stat-card">
            <span class="label">Files</span>
            <span class="value" id="stat-files">0 / 0</span>
          </div>
        </div>

        <!-- Hidden progress elements kept in DOM for compatibility with JS bindings -->
        <div class="progress-container" style="display: none;">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- Speed Graph (Replaces the green bar) -->
        <div class="graph-container" data-tauri-drag-region>
          <canvas id="speed-canvas" width="288" height="24"></canvas>
        </div>

        <!-- Progress Metadata & Cancel Button -->
        <div class="progress-meta" data-tauri-drag-region>
          <div data-tauri-drag-region style="white-space: nowrap;">
            <span id="progress-percent">0%</span>
            <span id="progress-bytes" style="margin-left: 8px;">0 MB / 0 MB</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap;">
            <span id="status-msg">Waiting...</span>
            <button class="mini-cancel-btn" id="cancel-btn">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Active Transfers List (Hidden via CSS) -->
      <div class="jobs-list" id="jobs-list" style="display: none;">
        <div class="job-item empty">No active copy transfers.</div>
      </div>
      
      <!-- Error Summary Overlay (Hidden by default) -->
      <div class="error-overlay" id="error-overlay" style="display: none;">
        <div class="error-header">
          <span>⚠️ Transfer completed with errors</span>
        </div>
        <div class="error-content" id="error-list">
          <!-- Dynamically populated -->
        </div>
        <div class="error-actions">
          <button class="action-btn" id="error-close-btn">Dismiss</button>
        </div>
      </div>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
