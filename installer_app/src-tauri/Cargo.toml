[package]
name = "better_copy_installer"
version = "0.1.0"
description = "BetterCopy custom neon-glass installer stub"
authors = ["RADIN MNX"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "better_copy_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3" }
tauri-plugin-dialog = "2"