name: Build Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      NUGET_CERT_REVOCATION_MODE: offline

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        lfs: true

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

    - name: Build bcopy CLI
      run: cargo build --release -p bcopy

    - name: Build native dashboard
      run: cargo build --release -p better_copy_native

    - name: Install tauri-cli
      run: cargo install tauri-cli --locked

    - name: Patch tauri.conf.json for bundle
      shell: pwsh
      run: |
        $p = "better_copy_gui\src-tauri\tauri.conf.json"
        $json = Get-Content $p -Raw | ConvertFrom-Json
        $json.identifier = "com.radinmnx2.bettercopy"
        $json.bundle.PSObject.Properties.Remove("android")
        $json | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding utf8
        Get-Content $p

    - name: Build Tauri GUI bundle
      shell: pwsh
      run: |
        cd better_copy_gui/src-tauri
        cargo tauri build

    - name: Verify outputs
      shell: pwsh
      run: |
        "=== bcopy ==="
        Get-Item "target\release\bcopy.exe" | Select-Object FullName, Length
        "=== native ==="
        Get-Item "target\release\better_copy_native.exe" | Select-Object FullName, Length
        "=== bundles ==="
        Get-ChildItem "target\release\bundle\" -Recurse -File | Select-Object FullName, Length

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.3.3
      with:
        name: BetterCopy-windows
        path: |
          target\release\bcopy.exe
          target\release\better_copy_native.exe
          target\release\bundle\
        compression-level: 0

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: v0.1.0-${{ github.run_id }}
      shell: pwsh
      run: |
        $files = @()
        $files += "target\release\bcopy.exe"
        $files += "target\release\better_copy_native.exe"
        $files += @(Get-ChildItem "target\release\bundle\" -Recurse -File | ForEach-Object { $_.FullName })
        if ($files.Count -eq 0) { Write-Error "No release assets found"; exit 1 }
        $release = gh release create $env:TAG $files --repo ${{ github.repository }} --title "BetterCopy build ${{ github.run_id }}" --notes "Automated build of BetterCopy (CLI bcopy, native tray dashboard and Tauri GUI) for Windows." --latest
        Write-Host "Release created: $release"